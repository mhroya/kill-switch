<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill Switch: Phantom</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="screen-menu" class="screen on" aria-label="Əsas menyu"></section>
  <section id="screen-game" class="screen" aria-label="Oyun">
    <header id="hud"></header>
    <main id="scene"></main>
    <footer id="bar"></footer>
  </section>
  <section id="screen-end" class="screen" aria-label="Oyunun sonu"></section>
</div>
<div id="overlays"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">Oyun üçün brauzerdə JavaScript açıq olmalıdır.</p></noscript>

<!-- ES modules yoxdur: adi skriptlər, hamısı global Game obyektinə əlavə edir. Sıra vacibdir. -->
<!-- 1. Əsas modullar -->
<script src="js/core/events.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/timer.js"></script>
<script src="js/core/trace.js"></script>
<script src="js/core/puzzles.js"></script>
<!-- 2. Hekayə və mətnlər (otaqlardan əvvəl yüklənməlidir) -->

<script src="js/story/suspects.js"></script>
<script src="js/story/facts.js"></script>
<!-- 3. İnterfeys -->
<script src="js/ui/popup.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/inventory.js"></script>

<script src="js/rooms/act2.js"></script>
<script src="js/rooms/act3.js"></script>
<script src="js/rooms/act4.js"></script>

<script src="js/story/endings.js"></script>
<script src="js/core/debug.js"></script>
<script src="js/main.js"></script>

</html>
